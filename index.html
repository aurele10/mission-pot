<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769c2">
  <meta name="description" content="Mission Pot d’Aurèle : un suivi ludique et motivant de la semaine.">

  <title>Mission Pot d’Aurèle 🚀</title>

  <link rel="manifest" href="./manifest.json">

<style>
#rocketCelebration {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
  pointer-events: none;
}

.celebration-rocket {
  position: absolute;
  bottom: -80px;
  font-size: 34px;
  opacity: 0;
  filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.2));
  animation: rocketTakeoff var(--duration) ease-in forwards;
  animation-delay: var(--delay);
}

@keyframes rocketTakeoff {
  0% {
    transform: translateY(0) rotate(var(--rotation)) scale(0.7);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  70% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-120vh)
      translateX(var(--drift))
      rotate(var(--rotation))
      scale(1.15);
    opacity: 0;
  }
}
  <style>
    :root {
      color-scheme: light;
      --blue: #1769c2;
      --blue-dark: #0d4f99;
      --sky: #dff1ff;
      --white: #ffffff;
      --text: #183046;
      --muted: #64798b;
      --success: #17875b;
      --danger: #c73a4a;
      --shadow: 0 10px 30px rgba(25, 76, 117, 0.14);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--sky);
    }

    body {
      <div id="rocketCelebration" aria-hidden="true"></div>
      min-height: 100vh;
      margin: 0;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), transparent 38%),
        linear-gradient(180deg, #dff1ff 0%, #eef8ff 100%);
      color: var(--text);
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .hero {
      padding: 10px 4px 18px;
      text-align: center;
    }

    .hero__eyebrow {
      margin: 0 0 5px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.45rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .hero__text {
      max-width: 520px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .card {
      border: 1px solid rgba(23, 105, 194, 0.1);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .score-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      margin-bottom: 18px;
      padding: 22px;
      overflow: hidden;
    }

    .score-card__label {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score {
      margin: 3px 0 13px;
      font-size: clamp(2.15rem, 10vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .progress {
      height: 15px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5eef5;
    }

    .progress__bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1769c2, #54b8ff);
      transition: width 300ms ease;
    }

    .score-card__caption {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .planet {
      display: grid;
      width: clamp(82px, 20vw, 120px);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #f1f9ff, #cfeaff);
      box-shadow:
        inset -12px -12px 24px rgba(23, 105, 194, 0.1),
        0 12px 28px rgba(23, 105, 194, 0.16);
      font-size: clamp(3.25rem, 13vw, 5.7rem);
      transition: transform 220ms ease;
    }

    .planet.is-celebrating {
      animation: bounce 600ms ease;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin: 0 2px 12px;
    }

    .reset-button {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 750;
      cursor: pointer;
    }

    .reset-button:hover,
    .reset-button:focus-visible {
      color: var(--danger);
      outline: 3px solid rgba(199, 58, 74, 0.14);
    }

    .days {
      display: grid;
      gap: 14px;
    }

    .day-card {
      padding: 18px;
    }

    .day-card__header {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .day-card h2 {
      margin: 0;
      font-size: 1.22rem;
    }

    .star-button {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #eef4f8;
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    .star-button:hover {
      transform: scale(1.07);
    }

    .star-button[aria-pressed="true"] {
      background: #fff4c2;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .counter {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      border-radius: 16px;
      padding: 10px;
      background: #f2f8fc;
    }

    .counter__icon {
      font-size: 1.45rem;
    }

    .counter__text {
      min-width: 0;
    }

    .counter__label {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .counter__value {
      display: block;
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .counter__actions {
      display: flex;
      gap: 6px;
    }

    .counter-button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: var(--white);
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
    }

    .counter-button:hover,
    .counter-button:focus-visible {
      background: var(--blue-dark);
      outline: 3px solid rgba(23, 105, 194, 0.2);
    }

    .counter-button--minus {
      background: #dce9f2;
      color: var(--text);
    }

    .counter-button--minus:hover,
    .counter-button--minus:focus-visible {
      background: #cadde9;
    }

    .footer {
      padding: 22px 8px 4px;
      color: var(--muted);
      text-align: center;
      font-size: 0.8rem;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0); }
      35% { transform: translateY(-12px) rotate(-7deg); }
      70% { transform: translateY(2px) rotate(7deg); }
    }

    @media (min-width: 640px) {
      .days {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .day-card:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 430px) {
      .score-card {
        gap: 10px;
        padding: 18px;
      }

      .counter-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="hero">
      <p class="hero__eyebrow">Objectif de la semaine</p>
      <h1>🚀 Mission Pot d’Aurèle</h1>
      <p class="hero__text">
        Chaque petit progrès fait grandir la planète. On avance un jour après l’autre !
      </p>
    </header>

    <section class="card score-card" aria-labelledby="score-title">
      <div>
        <p class="score-card__label" id="score-title">Étoiles gagnées</p>
        <p class="score"><span id="score">0</span> ⭐</p>

        <div
          class="progress"
          role="progressbar"
          aria-label="Progression vers l’objectif"
          aria-valuemin="0"
          aria-valuemax="30"
          aria-valuenow="0"
        >
          <div class="progress__bar" id="progress-bar"></div>
        </div>

        <p class="score-card__caption" id="progress-caption">
          Encore 30 étoiles pour atteindre la mission !
        </p>
      </div>

      <div class="planet" id="planet" aria-label="Planète de départ" role="img">🌑</div>
    </section>

    <div class="toolbar">
      <button class="reset-button" id="reset-button" type="button">
        Recommencer la semaine
      </button>
    </div>

    <section class="days" id="days" aria-label="Suivi des jours de la semaine"></section>

    <footer class="footer">
      Les progrès sont enregistrés automatiquement sur cet appareil.
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "missionAurele";
      const GOAL = 30;
      const STAR_BONUS = 2;

      const dayNames = [
        "Lundi",
        "Mardi",
        "Mercredi",
        "Jeudi",
        "Vendredi",
        "Samedi",
        "Dimanche"
      ];

      const scoreElement = document.getElementById("score");
      const progressElement = document.querySelector(".progress");
      const progressBarElement = document.getElementById("progress-bar");
      const progressCaptionElement = document.getElementById("progress-caption");
      const planetElement = document.getElementById("planet");
      const daysElement = document.getElementById("days");
      const resetButton = document.getElementById("reset-button");

      function createEmptyWeek() {
        return dayNames.map(() => ({
          pipi: 0,
          caca: 0,
          star: false
        }));
      }

      function normalizeWeek(value) {
        if (!Array.isArray(value) || value.length !== dayNames.length) {
          return createEmptyWeek();
        }

        return value.map((day) => ({
          pipi: Math.max(0, Number(day.pipi ?? day.p ?? 0) || 0),
          caca: Math.max(0, Number(day.caca ?? day.c ?? 0) || 0),
          star: Boolean(day.star ?? day.s)
        }));
      }

      function loadWeek() {
        try {
          const savedValue = localStorage.getItem(STORAGE_KEY);
          return savedValue
            ? normalizeWeek(JSON.parse(savedValue))
            : createEmptyWeek();
        } catch (error) {
          console.warn("Impossible de lire les progrès enregistrés.", error);
          return createEmptyWeek();
        }
      }

      let week = loadWeek();

      function saveWeek() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(week));
        } catch (error) {
          console.warn("Impossible d’enregistrer les progrès.", error);
        }
      }

      function getTotalScore() {
        return week.reduce(
          (total, day) =>
            total + day.pipi + day.caca + (day.star ? STAR_BONUS : 0),
          0
        );
      }

      function getPlanet(score) {
        if (score >= GOAL) {
          return { emoji: "🪐", label: "Mission accomplie" };
        }

        if (score >= 20) {
          return { emoji: "🌍", label: "Une belle planète bleue" };
        }

        if (score >= 10) {
          return { emoji: "🌕", label: "Une lune brillante" };
        }

        if (score >= 5) {
          return { emoji: "🌙", label: "Un croissant de lune" };
        }

        return { emoji: "🌑", label: "Planète de départ" };
      }

      function updateScore() {
        const score = getTotalScore();
        const progress = Math.min((score / GOAL) * 100, 100);
        const remaining = Math.max(GOAL - score, 0);
        const planet = getPlanet(score);

        scoreElement.textContent = String(score);
        progressBarElement.style.width = `${progress}%`;
        progressElement.setAttribute("aria-valuenow", String(Math.min(score, GOAL)));
        planetElement.textContent = planet.emoji;
        planetElement.setAttribute("aria-label", planet.label);

        if (remaining === 0) {
          progressCaptionElement.textContent = "Mission accomplie ! Bravo Aurèle ! 🎉";
        } else if (remaining === 1) {
          progressCaptionElement.textContent =
            "Encore 1 étoile pour atteindre la mission !";
        } else {
          progressCaptionElement.textContent =
            `Encore ${remaining} étoiles pour atteindre la mission !`;
        }
      }

      function createCounter(dayIndex, type, icon, label) {
        const wrapper = document.createElement("div");
        wrapper.className = "counter";

        const iconElement = document.createElement("span");
        iconElement.className = "counter__icon";
        iconElement.textContent = icon;
        iconElement.setAttribute("aria-hidden", "true");

        const textElement = document.createElement("span");
        textElement.className = "counter__text";

        const labelElement = document.createElement("span");
        labelElement.className = "counter__label";
        labelElement.textContent = label;

        const valueElement = document.createElement("span");
        valueElement.className = "counter__value";
        valueElement.textContent = String(week[dayIndex][type]);

        textElement.append(labelElement, valueElement);

        const actionsElement = document.createElement("span");
        actionsElement.className = "counter__actions";

        const minusButton = document.createElement("button");
        minusButton.className = "counter-button counter-button--minus";
        minusButton.type = "button";
        minusButton.textContent = "−";
        minusButton.setAttribute(
          "aria-label",
          `Retirer un ${label.toLowerCase()} pour ${dayNames[dayIndex]}`
        );
        minusButton.disabled = week[dayIndex][type] <= 0;
        minusButton.addEventListener("click", () => changeCount(dayIndex, type, -1));

        const plusButton = document.createElement("button");
        plusButton.className = "counter-button";
        plusButton.type = "button";
        plusButton.textContent = "+";
        plusButton.setAttribute(
          "aria-label",
          `Ajouter un ${label.toLowerCase()} pour ${dayNames[dayIndex]}`
        );
        plusButton.addEventListener("click", () => changeCount(dayIndex, type, 1));

        actionsElement.append(minusButton, plusButton);
        wrapper.append(iconElement, textElement, actionsElement);

        return wrapper;
      }

      function renderDays() {
        daysElement.replaceChildren();

        week.forEach((day, dayIndex) => {
          const card = document.createElement("article");
          card.className = "card day-card";

          const header = document.createElement("div");
          header.className = "day-card__header";

          const title = document.createElement("h2");
          title.textContent = dayNames[dayIndex];

          const starButton = document.createElement("button");
          starButton.className = "star-button";
          starButton.type = "button";
          starButton.textContent = day.star ? "⭐" : "☆";
          starButton.setAttribute("aria-pressed", String(day.star));
          starButton.setAttribute(
            "aria-label",
            `${day.star ? "Retirer" : "Ajouter"} l’étoile bonus de ${dayNames[dayIndex]}`
          );
          starButton.addEventListener("click", () => toggleStar(dayIndex));

          header.append(title, starButton);

          const counterGrid = document.createElement("div");
          counterGrid.className = "counter-grid";
          counterGrid.append(
            createCounter(dayIndex, "pipi", "💧", "Pipi"),
            createCounter(dayIndex, "caca", "💩", "Caca")
          );

          card.append(header, counterGrid);
          daysElement.append(card);
        });
      }

      function render() {
    renderDays();
    updateScore();
    checkPlanetChange(getTotalScore());
}

      function changeCount(dayIndex, type, amount) {
        week[dayIndex][type] = Math.max(0, week[dayIndex][type] + amount);
        saveWeek();
        render();
      }

      function toggleStar(dayIndex) {
        const wasComplete = getTotalScore() >= GOAL;
        week[dayIndex].star = !week[dayIndex].star;
        saveWeek();
        render();

        const isComplete = getTotalScore() >= GOAL;
        if (!wasComplete && isComplete) {
          planetElement.classList.remove("is-celebrating");
          void planetElement.offsetWidth;
          planetElement.classList.add("is-celebrating");
        }
      }

      function resetWeek() {
        const confirmed = window.confirm(
          "Recommencer la semaine et effacer tous les progrès ?"
        );

        if (!confirmed) {
          return;
        }

        week = createEmptyWeek();
        saveWeek();
        render();
      }
const PLANET_LEVEL_KEY = "mission-pot-aurele-planet-level";

function getPlanetLevel(stars) {
  if (stars >= 30) return 3;
  if (stars >= 15) return 2;
  if (stars >= 5) return 1;
  return 0;
}

function launchRocketCelebration() {
  const container = document.getElementById("rocketCelebration");

  if (!container) return;

  container.innerHTML = "";

  for (let i = 0; i < 18; i++) {
    const rocket = document.createElement("span");

    rocket.className = "celebration-rocket";
    rocket.textContent = "🚀";

    rocket.style.left = Math.random() * 94 + "%";
    rocket.style.fontSize = 24 + Math.random() * 26 + "px";
    rocket.style.setProperty("--duration", 1.8 + Math.random() * 1.5 + "s");
    rocket.style.setProperty("--delay", Math.random() * 0.8 + "s");
    rocket.style.setProperty("--drift", -80 + Math.random() * 160 + "px");
    rocket.style.setProperty("--rotation", -18 + Math.random() * 36 + "deg");

    container.appendChild(rocket);
  }

  window.setTimeout(() => {
    container.innerHTML = "";
  }, 4500);
}

function checkPlanetChange(stars) {
  const newLevel = getPlanetLevel(stars);
  const savedLevelRaw = localStorage.getItem(PLANET_LEVEL_KEY);

  if (savedLevelRaw === null) {
    localStorage.setItem(PLANET_LEVEL_KEY, String(newLevel));
    return;
  }

  const savedLevel = Number(savedLevelRaw);

  if (newLevel > savedLevel) {
    launchRocketCelebration();
  }

  localStorage.setItem(PLANET_LEVEL_KEY, String(newLevel));
}
      resetButton.addEventListener("click", resetWeek);
      render();
launchRocketCelebration();
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(() => {
              // L’application reste utilisable sans service worker.
            });
        });
      }
    })();
  </script>
</body>
</html>
