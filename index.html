<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>Mission Pot d'Aurèle 🚀</title>

<style>

:root{
  --blue:#1769c2;
  --sky:#dff1ff;
  --dark:#17345f;
  --yellow:#ffd84d;
  --green:#55c58a;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(#bfe3ff,#ffffff);
  color:var(--dark);
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
  text-align:center;
}

.rocket{
  font-size:75px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{transform:translateY(-12px);}
}

h1{
  color:var(--blue);
  font-size:32px;
}

.card{
  background:white;
  border-radius:25px;
  padding:20px;
  margin:18px 0;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.planet{
  font-size:60px;
}

.stars{
  font-size:25px;
  color:#d99b00;
  margin:10px;
}

.progress{
  height:25px;
  background:#dcecff;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#55c58a,#ffd84d);
  transition:.5s;
}

.destination{
  margin-top:12px;
  font-weight:bold;
}

.day{
  background:#fafdff;
  border-radius:20px;
  padding:15px;
  margin:12px 0;
  text-align:left;
}

.day h3{
  margin:0 0 12px;
  color:var(--blue);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.action{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:12px 0;
}

.icon-count{
  font-size:22px;
}

button{
  border:0;
  border-radius:18px;
  padding:12px 18px;
  background:var(--blue);
  color:white;
  font-size:18px;
}

.star{
  font-size:40px;
  cursor:pointer;
  filter:grayscale(1);
}

.star.active{
  filter:none;
}

.message{
  color:var(--green);
  font-weight:bold;
  min-height:25px;
}

</style>
</head>

<body>

<div class="container">

<div class="rocket">🚀</div>

<h1>Mission Pot de Départ</h1>

<p>
Bienvenue <strong>Aurèle</strong> ⭐
</p>


<div class="card">

<h2>🌌 Voyage spatial</h2>

<div id="planet" class="planet">
🌍
</div>

<div id="stars" class="stars">
0 ⭐
</div>

<div class="progress">
<div id="bar" class="progress-bar"></div>
</div>

<p id="destination" class="destination">
La fusée se prépare !
</p>

</div>


<div class="card">

<h2>📅 Missions de la semaine</h2>

<div id="days"></div>

</div>
<div class="card">

<h2>🌟 Récompense du soir</h2>

<p>
Quand la journée est réussie :
</p>

<div id="todayReward" class="star">
⭐
</div>

</div>

<p id="message" class="message"></p>

</div>


<script>

const jours = [
"Lundi",
"Mardi",
"Mercredi",
"Jeudi",
"Vendredi",
"Samedi",
"Dimanche"
];


let data;

try{
 data = JSON.parse(localStorage.getItem("missionPotAurele"));
}
catch(e){
 data=null;
}


if(!data || !Array.isArray(data.days)){
 data={
  days: jours.map(()=>({
    pipi:0,
    caca:0,
    reward:false
  }))
 };
}


function save(){
 localStorage.setItem(
  "missionPotAurele",
  JSON.stringify(data)
 );
}


function totalStars(){

 let total=0;

 data.days.forEach(j=>{
  total += j.pipi;
  total += j.caca;

  if(j.reward){
   total += 2;
  }
 });

 return total;

}


function add(day,type){

 data.days[day][type]++;

 save();
 render();

}


function toggleReward(day){

 data.days[day].reward =
 !data.days[day].reward;

 save();

 document.getElementById("message").textContent =
 data.days[day].reward
 ?
 "🚀 Bravo Aurèle ! Décollage réussi !"
 :
 "";

 render();

}


function render(){

 const container =
 document.getElementById("days");

 container.innerHTML="";


 jours.forEach((jour,i)=>{

 const d=data.days[i];


 container.innerHTML += `

 <div class="day">

 <h3>
 ${jour}

 <span 
 onclick="toggleReward(${i})"
 class="star ${d.reward ? 'active':''}">
 ⭐
 </span>

 </h3>


 <div class="action">

 <span class="icon-count">
 💧 Pipi : ${d.pipi}
 </span>

 <button onclick="add(${i},'pipi')">
 + 💧
 </button>

 </div>


 <div class="action">

 <span class="icon-count">
 💩 Caca : ${d.caca}
 </span>

 <button onclick="add(${i},'caca')">
 + 💩
 </button>

 </div>


 </div>

 `;

 });


 let stars=totalStars();


 document.getElementById("stars").textContent =
 stars+" ⭐";


 let percent=Math.min(stars*4,100);


 document.getElementById("bar").style.width =
 percent+"%";


 let planet="🌍";
 let text="La fusée se prépare !";


 if(stars>=5){
  planet="🌙";
  text="La fusée atteint la Lune !";
 }

 if(stars>=15){
  planet="🔴";
  text="Direction Mars !";
 }

 if(stars>=30){
  planet="🪐";
  text="Saturne est en vue !";
 }


 document.getElementById("planet").textContent =
 planet;


 document.getElementById("destination").textContent =
 text;

}


render();

</script>

</body>
</html>
