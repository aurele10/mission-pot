<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<title>Mission Pot d'Aurèle 🚀</title>

<style>

:root{
 --blue:#1769c2;
 --sky:#dff1ff;
 --dark:#12345b;
 --gold:#ffd84d;
 --green:#55c58a;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(#bfe3ff,#ffffff);
 color:var(--dark);
}

.container{
 max-width:520px;
 margin:auto;
 padding:20px;
 text-align:center;
}

.rocket{
 font-size:75px;
 animation:float 2s infinite ease-in-out;
}

@keyframes float{
 50%{transform:translateY(-12px);}
}

h1{
 color:var(--blue);
 font-size:32px;
 margin:5px;
}

.card{
 background:white;
 border-radius:25px;
 padding:20px;
 margin:18px 0;
 box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.planet{
 font-size:55px;
}

.stars{
 font-size:24px;
 color:#e5a900;
 min-height:35px;
}

.progress{
 height:25px;
 background:#dcecff;
 border-radius:20px;
 overflow:hidden;
 margin:15px 0;
}

.progress-bar{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#55c58a,#ffd84d);
 transition:.5s;
}

button{
 border:0;
 border-radius:20px;
 padding:14px 18px;
 font-size:18px;
 background:var(--blue);
 color:white;
 margin:6px;
}

.plus{
 font-size:22px;
}

.day{
 background:#fff;
 border-radius:20px;
 padding:15px;
 margin:12px 0;
 text-align:left;
}

.day h3{
 color:var(--blue);
 margin:0;
 display:flex;
 justify-content:space-between;
}

.count{
 font-size:20px;
 margin:8px 0;
}

.bigstar{
 font-size:45px;
 cursor:pointer;
 filter:grayscale(1);
}

.bigstar.on{
 filter:none;
}

.message{
 color:var(--green);
 font-weight:bold;
 min-height:25px;
}

</style>
</head>

<body>

<div class="container">

<div class="rocket">🚀</div>

<h1>Mission Pot de Départ</h1>

<p>
Bienvenue <strong>Aurèle</strong> ⭐
</p>

<div class="card">

<h2>🌌 Voyage spatial</h2>

<div id="planet" class="planet">
🌍
</div>

<div class="stars" id="totalStars">
0 ⭐
</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<p id="destination">
La fusée se prépare au décollage !
</p>

</div>
<div class="card">
<h2>📅 Mission de la semaine</h2>
<div id="days"></div>
</div>

<div class="card">
<h2>🌟 Récompense</h2
<div id="rewardStar" class="bigstar" onclick="toggleReward()">
⭐
</div>

<p id="message" class="message"></p>

</div>

</div>


<script>

const jours = [
"Lundi",
"Mardi",
"Mercredi",
"Jeudi",
"Vendredi",
"Samedi",
"Dimanche"
];


let data = JSON.parse(localStorage.getItem("missionPotAurele")) || {
  days: jours.map(() => ({
    pipi:0,
    caca:0,
    reward:false
  }))
};


function save(){
 localStorage.setItem(
  "missionPotAurele",
  JSON.stringify(data)
 );
}


function totalStars(){

 let total=0;

 data.days.forEach(j=>{
   total += j.pipi;
   total += j.caca;
   if(j.reward) total += 2;
 });

 return total;

}


function add(day,type){

 data.days[day][type]++;

 save();
 render();

}


function toggleReward(day){

 data.days[day].reward =
 !data.days[day].reward;

 save();
 render();

}


function render(){

 let container =
 document.getElementById("days");

 container.innerHTML="";


 jours.forEach((jour,i)=>{

 let d=data.days[i];

 container.innerHTML += `

 <div class="day">

 <h3>
 ${jour}

 <span onclick="toggleReward(${i})"
 class="bigstar ${d.reward?'on':''}">
 ⭐
 </span>

 </h3>


 <div class="count">
 💧 Pipi : ${d.pipi}
 </div>

 <button onclick="add(${i},'pipi')">
 + 💧
 </button>


 <div class="count">
 💩 Caca : ${d.caca}
 </div>

 <button onclick="add(${i},'caca')">
 + 💩
 </button>


 </div>

 `;

 });


 let stars=totalStars();


 document.getElementById("totalStars").innerHTML =
 stars+" ⭐";


 let percent=Math.min(stars*5,100);


 document.getElementById("progressBar").style.width =
 percent+"%";


 let planet="🌍";
 let text="La fusée se prépare au décollage !";


 if(stars>=5){
   planet="🌙";
   text="Direction la Lune !";
 }

 if(stars>=15){
   planet="🔴";
   text="Mars est en vue !";
 }

 if(stars>=30){
   planet="🪐";
   text="Bravo Aurèle, Saturne approche !";
 }


 document.getElementById("planet").innerHTML =
 planet;


 document.getElementById("destination").innerHTML =
 text;


}


render();


</script>

</body>
</html>
